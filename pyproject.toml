[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaosloop"
version = "0.1.0"
description = "Deterministic scheduler fuzzing for asyncio"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["asyncio", "testing", "concurrency", "fuzzing", "deterministic"]
dependencies = []

[project.scripts]
chaosloop = "chaosloop.cli.main:main"

[project.optional-dependencies]
cli = ["rich>=13"]

[project.entry-points.pytest11]
chaosloop = "chaosloop.pytest_plugin"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = ""
Issues = ""

[tool.hatch.build.targets.wheel]
packages = ["src/chaosloop"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/chaosloop"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests, excluded from the default run",
    "nightly: determinism soak tests",
]
